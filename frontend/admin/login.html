<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | VISWASHANTHI HIGH SCHOOL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
    <section class="login-shell">
        <div class="login-card">
            <div class="login-cover d-flex flex-column justify-content-center">
                <div class="mb-4">
                    <span class="admin-brand-mark d-inline-flex mb-3" style="width:64px;height:64px;">
                        <img class="brand-logo" src="../school images/logo.png" alt="VISWASHANTHI HIGH SCHOOL logo">
                    </span>
                    <h1 class="display-6 fw-bold text-white">VISWASHANTHI HIGH SCHOOL</h1>
                </div>
                <h2 class="h4 fw-bold text-white">School Management Dashboard</h2>
                <p class="text-white-50 mt-2">Manage banners, faculty, gallery, admissions, and school settings from one secure admin workspace.</p>
                <div class="mt-4 d-flex gap-3 flex-wrap">
                    <div class="d-flex align-items-center gap-2">
                        <i class="bi bi-check-circle-fill text-success"></i>
                        <span class="text-white-50">Secure Access</span>
                    </div>
                    <div class="d-flex align-items-center gap-2">
                        <i class="bi bi-check-circle-fill text-success"></i>
                        <span class="text-white-50">Encrypted Connection</span>
                    </div>
                    <div class="d-flex align-items-center gap-2">
                        <i class="bi bi-check-circle-fill text-success"></i>
                        <span class="text-white-50">Admin Only</span>
                    </div>
                </div>
            </div>
            <div class="login-form-wrap d-flex flex-column justify-content-center">
                <div class="text-center mb-4">
                    <i class="bi bi-shield-lock fs-1 text-primary mb-2 d-block"></i>
                    <h2 class="fw-bold mb-1">Welcome Back</h2>
                    <p class="text-muted">Sign in to continue managing the school website.</p>
                </div>
                <div class="alert alert-danger d-none rounded-3" id="loginMessage"></div>
                <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 rounded-start-3">
                                <i class="bi bi-person text-muted"></i>
                            </span>
                            <input class="form-control border-start-0 rounded-end-3" type="text" name="username" placeholder="Enter username" required autocomplete="username">
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 rounded-start-3">
                                <i class="bi bi-lock text-muted"></i>
                            </span>
                            <input class="form-control border-start-0 rounded-end-3" type="password" name="password" placeholder="Enter password" required autocomplete="current-password">
                        </div>
                    </div>
                    <button class="btn btn-primary w-100 py-3 fw-semibold rounded-3 shadow-sm" type="submit">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                    </button>
                </form>
                <div class="text-center mt-4">
                    <a href="../index.html" class="text-muted small text-decoration-none">
                        <i class="bi bi-arrow-left me-1"></i>Back to Website
                    </a>
                </div>
            </div>
        </div>
    </section>
    <script src="../js/auth.js"></script>
</body>
</html>
