<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery Management | VISWASHANTHI HIGH SCHOOL</title>
    <script>document.documentElement.classList.add('admin-auth-pending');</script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body data-admin-page="gallery" data-requires-auth="true">
    <div class="admin-layout">
        <aside class="admin-sidebar" id="adminSidebar">
            <div class="admin-brand">
                <span class="admin-brand-mark"><i class="bi bi-mortarboard-fill"></i></span>
                <span>VISWASHANTHI HIGH SCHOOL</span>
            </div>
            <nav class="admin-nav">
                <a class="admin-nav-link" data-page="dashboard" href="dashboard.html"><i class="bi bi-grid"></i>Dashboard</a>
                <a class="admin-nav-link" data-page="banner" href="banner.html"><i class="bi bi-card-image"></i>Banners</a>
                <a class="admin-nav-link" data-page="faculty" href="faculty.html"><i class="bi bi-people"></i>Faculty</a>
                <a class="admin-nav-link active" data-page="gallery" href="gallery.html"><i class="bi bi-images"></i>Gallery</a>
                <a class="admin-nav-link" data-page="admissions" href="admissions.html"><i class="bi bi-journal-check"></i>Admissions</a>
                <a class="admin-nav-link" data-page="settings" href="settings.html"><i class="bi bi-gear"></i>Settings</a>
            </nav>
        </aside>
        <main class="admin-content">
            <div class="admin-topbar">
                <div class="d-flex align-items-center gap-3">
                    <button class="btn btn-outline-primary mobile-sidebar-toggle d-lg-none" id="sidebarToggle" type="button">
                        <i class="bi bi-list"></i>
                    </button>
                    <div>
                        <h1 class="h4 mb-1">Gallery Management</h1>
                        <p class="text-muted mb-0">Upload and curate school activity images.</p>
                    </div>
                </div>
                <button class="btn btn-outline-danger" data-logout>
                    <i class="bi bi-box-arrow-right me-2"></i>Logout
                </button>
            </div>
            <div class="admin-surface admin-card mb-4">
                <h2 class="h5 mb-3">Upload New Image</h2>
                <form id="galleryForm" class="admin-form">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">Title <span class="text-danger">*</span></label>
                            <input class="form-control" type="text" name="title" required placeholder="Enter image title">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Category</label>
                            <select class="form-select" name="category">
                                <option value="Campus">Campus</option>
                                <option value="Events">Events</option>
                                <option value="Sports">Sports</option>
                                <option value="Cultural">Cultural</option>
                                <option value="Academic">Academic</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Image <span class="text-danger">*</span></label>
                            <input class="form-control" type="file" name="image" accept="image/*" required>
                        </div>
                        <div class="col-12">
                            <button class="btn btn-primary" type="submit">
                                <i class="bi bi-cloud-upload me-2"></i>Upload Image
                            </button>
                        </div>
                    </div>
                </form>
            </div>
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h5 mb-0">Gallery Images</h2>
                <span class="badge bg-primary rounded-pill" id="galleryCount">0 Images</span>
            </div>
            <div class="gallery-admin-grid" id="galleryAdminGrid">
                <div class="text-center py-5 text-muted w-100">
                    <i class="bi bi-images fs-1 d-block mb-2"></i>
                    No gallery images uploaded yet.
                </div>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/dashboard.js"></script>
</body>
</html>
