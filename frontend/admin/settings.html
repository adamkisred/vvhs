<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | VISWASHANTHI HIGH SCHOOL</title>
    <script>document.documentElement.classList.add('admin-auth-pending');</script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body data-admin-page="settings" data-requires-auth="true">
    <div class="admin-layout">
        <aside class="admin-sidebar" id="adminSidebar">
            <div class="admin-brand">
                <span class="admin-brand-mark"><i class="bi bi-mortarboard-fill"></i></span>
                <span>VISWASHANTHI HIGH SCHOOL</span>
            </div>
            <nav class="admin-nav">
                <a class="admin-nav-link" data-page="dashboard" href="dashboard.html"><i class="bi bi-grid"></i>Dashboard</a>
                <a class="admin-nav-link" data-page="banner" href="banner.html"><i class="bi bi-card-image"></i>Banners</a>
                <a class="admin-nav-link" data-page="faculty" href="faculty.html"><i class="bi bi-people"></i>Faculty</a>
                <a class="admin-nav-link" data-page="gallery" href="gallery.html"><i class="bi bi-images"></i>Gallery</a>
                <a class="admin-nav-link" data-page="admissions" href="admissions.html"><i class="bi bi-journal-check"></i>Admissions</a>
                <a class="admin-nav-link active" data-page="settings" href="settings.html"><i class="bi bi-gear"></i>Settings</a>
            </nav>
        </aside>
        <main class="admin-content">
            <div class="admin-topbar">
                <div class="d-flex align-items-center gap-3">
                    <button class="btn btn-outline-primary mobile-sidebar-toggle d-lg-none" id="sidebarToggle" type="button">
                        <i class="bi bi-list"></i>
                    </button>
                    <div>
                        <h1 class="h4 mb-1">Site Settings</h1>
                        <p class="text-muted mb-0">Manage school content, contact details, and public website information.</p>
                    </div>
                </div>
                <button class="btn btn-outline-danger" data-logout>
                    <i class="bi bi-box-arrow-right me-2"></i>Logout
                </button>
            </div>
            <div class="row g-4">
                <div class="col-xl-8">
                    <div class="admin-surface admin-card">
                        <h2 class="h5 mb-4">Public Website Settings</h2>
                        <form id="settingsForm" class="admin-form">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label">School Name</label>
                                    <input class="form-control" type="text" name="schoolName">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Location</label>
                                    <input class="form-control" type="text" name="location">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Classes Range</label>
                                    <input class="form-control" type="text" name="classesRange">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Hero Tagline</label>
                                    <input class="form-control" type="text" name="heroTagline">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Contact Phone</label>
                                    <input class="form-control" type="text" name="contactPhone">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Contact Email</label>
                                    <input class="form-control" type="email" name="contactEmail">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Map Embed URL</label>
                                    <input class="form-control" type="text" name="mapEmbedUrl">
                                </div>
                                <div class="col-12">
                                    <label class="form-label">Address</label>
                                    <input class="form-control" type="text" name="address">
                                </div>
                                <div class="col-12">
                                    <label class="form-label">About Us</label>
                                    <textarea class="form-control" name="aboutUs" rows="3"></textarea>
                                </div>
                            </div>
                            <div class="mt-4">
                                <button class="btn btn-primary" type="submit">
                                    <i class="bi bi-save me-2"></i>Save Settings
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
                <div class="col-xl-4">
                    <div class="admin-surface admin-card">
                        <h2 class="h5 mb-4">Change Password</h2>
                        <form id="passwordForm" class="admin-form">
                            <div class="mb-3">
                                <label class="form-label">Current Password</label>
                                <input class="form-control" type="password" name="currentPassword" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">New Password</label>
                                <input class="form-control" type="password" name="newPassword" required>
                            </div>
                            <button class="btn btn-outline-primary" type="submit">
                                <i class="bi bi-key me-2"></i>Update Password
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/dashboard.js"></script>
</body>
</html>
