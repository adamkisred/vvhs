<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Management | VISWASHANTHI HIGH SCHOOL</title>
    <script>document.documentElement.classList.add('admin-auth-pending');</script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body data-admin-page="faculty" data-requires-auth="true">
    <div class="admin-layout">
        <aside class="admin-sidebar" id="adminSidebar">
            <div class="admin-brand">
                <span class="admin-brand-mark"><i class="bi bi-mortarboard-fill"></i></span>
                <span>VISWASHANTHI HIGH SCHOOL</span>
            </div>
            <nav class="admin-nav">
                <a class="admin-nav-link" data-page="dashboard" href="dashboard.html"><i class="bi bi-grid"></i>Dashboard</a>
                <a class="admin-nav-link" data-page="banner" href="banner.html"><i class="bi bi-card-image"></i>Banners</a>
                <a class="admin-nav-link active" data-page="faculty" href="faculty.html"><i class="bi bi-people"></i>Faculty</a>
                <a class="admin-nav-link" data-page="gallery" href="gallery.html"><i class="bi bi-images"></i>Gallery</a>
                <a class="admin-nav-link" data-page="admissions" href="admissions.html"><i class="bi bi-journal-check"></i>Admissions</a>
                <a class="admin-nav-link" data-page="settings" href="settings.html"><i class="bi bi-gear"></i>Settings</a>
            </nav>
        </aside>
        <main class="admin-content">
            <div class="admin-topbar">
                <div class="d-flex align-items-center gap-3 admin-topbar-main">
                    <button class="btn btn-outline-primary mobile-sidebar-toggle d-lg-none" id="sidebarToggle" type="button">
                        <i class="bi bi-list"></i>
                    </button>
                    <div>
                        <h1 class="h4 mb-1">Faculty Management</h1>
                        <p class="text-muted mb-0">Add, edit, and organise faculty profiles.</p>
                    </div>
                </div>
                <div class="d-flex gap-2 admin-topbar-actions">
                    <button class="btn btn-primary" id="createFacultyBtn" data-bs-toggle="modal" data-bs-target="#facultyModal">
                        <i class="bi bi-plus-lg me-2"></i>Add Faculty
                    </button>
                    <button class="btn btn-outline-danger" data-logout>
                        <i class="bi bi-box-arrow-right me-2"></i>Logout
                    </button>
                </div>
            </div>
            <div class="admin-surface admin-card">
                <div class="d-flex justify-content-between align-items-center mb-3 admin-section-head">
                    <h2 class="h5 mb-0">Faculty Members</h2>
                    <span class="badge bg-primary rounded-pill" id="facultyCount">0 Members</span>
                </div>
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead class="table-light">
                            <tr>
                                <th style="width: 70px;">Photo</th>
                                <th>Name</th>
                                <th>Subject</th>
                                <th class="d-none d-md-table-cell">Experience</th>
                                <th class="d-none d-lg-table-cell" style="width: 70px;">Order</th>
                                <th style="width: 90px;">Status</th>
                                <th class="text-end" style="width: 140px;">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="facultyTableBody">
                            <tr>
                                <td colspan="7" class="text-center py-5 text-muted">
                                    <i class="bi bi-people fs-1 d-block mb-2"></i>
                                    No faculty members found.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    <div class="modal fade" id="facultyModal" tabindex="-1" aria-labelledby="facultyModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content border-0 rounded-4 shadow-lg">
                <div class="modal-header bg-light rounded-top-4 border-0 px-4 py-3">
                    <h5 class="modal-title fw-bold" id="facultyModalLabel">
                        <i class="bi bi-plus-circle me-2"></i>Add Faculty
                    </h5>
                    <button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="facultyForm" class="admin-form">
                        <input type="hidden" name="facultyId">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Name <span class="text-danger">*</span></label>
                                <input class="form-control" type="text" name="name" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Subject <span class="text-danger">*</span></label>
                                <input class="form-control" type="text" name="subject" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Qualification</label>
                                <input class="form-control" type="text" name="qualification">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Experience</label>
                                <input class="form-control" type="text" name="experience">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Display Order</label>
                                <input class="form-control" type="number" name="displayOrder" value="0">
                            </div>
                            <div class="col-md-8">
                                <label class="form-label">Photo</label>
                                <input class="form-control" type="file" name="photo" accept="image/*">
                            </div>
                            <div class="col-12">
                                <label class="form-label">Bio</label>
                                <textarea class="form-control" name="bio" rows="3"></textarea>
                            </div>
                            <div class="col-12">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="isActive" id="facultyActive" checked>
                                    <label class="form-check-label fw-semibold" for="facultyActive">Active</label>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-0 px-4 py-3">
                    <button class="btn btn-outline-secondary" type="button" data-bs-dismiss="modal">
                        <i class="bi bi-x-lg me-2"></i>Cancel
                    </button>
                    <button class="btn btn-primary" type="submit" form="facultyForm">
                        <i class="bi bi-check-lg me-2"></i>Save Faculty
                    </button>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/dashboard.js"></script>
</body>
</html>
